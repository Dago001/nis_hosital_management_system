version: '3.8'

services:
  # Backend Laravel App
  app:
    build:
      context: ./backend
      dockerfile: ../Dockerfile
    image: nis-hms-backend:latest
    container_name: nis-hms-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=nis_hms
      - DB_USERNAME=nis_user
      - DB_PASSWORD=nis_secure_pass
      - CACHE_STORE=redis
      - REDIS_HOST=redis
    depends_on:
      - db
      - redis

  # Nginx Web Server for Backend and Frontend static assets
  web:
    image: nginx:alpine
    container_name: nis-hms-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: nis-hms-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=nis_hms
      - POSTGRES_USER=nis_user
      - POSTGRES_PASSWORD=nis_secure_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Redis Cache
  redis:
    image: redis:alpine
    container_name: nis-hms-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
